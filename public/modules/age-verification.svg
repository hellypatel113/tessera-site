<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A dimmed store behind a pop-up asking "Are you 18+?"; the shopper presses Yes.</title>
<style>
.av-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.av-b0{animation:av-d0 11s ease-in-out infinite alternate}.av-b1{animation:av-d1 9s ease-in-out infinite alternate}.av-b2{animation:av-d0 12s ease-in-out infinite alternate-reverse}
@keyframes av-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes av-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.av-cur{animation:av-cur 5s ease-in-out infinite}
.av-yes{transform-box:fill-box;transform-origin:center;animation:av-yes 5s ease-in-out infinite}
@keyframes av-cur{0%,10%{transform:translate(0,0)}22%{transform:translate(46px,30px)}54%{transform:translate(0,0)}100%{transform:translate(0,0)}}
@keyframes av-yes{0%,54%,72%,100%{transform:scale(1)}62%{transform:scale(.93)}}
}
</style>
<defs><linearGradient id="av-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient><radialGradient id="av-r0"><stop offset="0" stop-color="#E879F9" stop-opacity=".75"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/></radialGradient><radialGradient id="av-r1"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="av-r2"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="av-b0" cx="40" cy="30" r="130" fill="url(#av-r0)"/>
<circle class="av-b1" cx="300" cy="160" r="140" fill="url(#av-r1)"/>
<circle class="av-b2" cx="250" cy="10" r="100" fill="url(#av-r2)"/>
<rect x="16" y="13" width="288" height="158" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="16" y="10" width="288" height="158" rx="12" fill="#fff"/>
<g opacity=".8">
<rect x="28" y="22" width="60" height="8" rx="4" fill="#DDE1E6"/>
<rect x="28" y="40" width="80" height="80" rx="9" fill="#EEE6FF"/>
<rect x="120" y="40" width="80" height="80" rx="9" fill="#EEE6FF"/>
<rect x="212" y="40" width="80" height="80" rx="9" fill="#EEE6FF"/>
<rect x="28" y="130" width="60" height="7" rx="3.5" fill="#DDE1E6"/><rect x="120" y="130" width="50" height="7" rx="3.5" fill="#DDE1E6"/><rect x="212" y="130" width="64" height="7" rx="3.5" fill="#DDE1E6"/>
</g>
<rect x="16" y="10" width="288" height="158" rx="12" fill="#1F2433" opacity=".16"/>
<g class="av-f" font-size="11">
<rect x="80" y="35" width="160" height="110" rx="12" fill="#1F2433" opacity=".18"/>
<rect x="80" y="32" width="160" height="110" rx="12" fill="#fff"/>
<text x="160" y="64" fill="#1F2433" font-size="16" font-weight="600" text-anchor="middle">Are you 18+?</text>
<rect x="112" y="76" width="96" height="6" rx="3" fill="#DDE1E6"/>
<rect x="96" y="104" width="60" height="26" rx="13" fill="#fff" stroke="#C9CED5"/>
<text x="126" y="121" fill="#1F2433" font-weight="600" text-anchor="middle">No</text>
<g class="av-yes"><rect x="164" y="104" width="60" height="26" rx="13" fill="url(#av-g)"/>
<text x="194" y="121" fill="#fff" font-weight="600" text-anchor="middle">Yes</text></g>
<g class="av-cur"><path d="M212 119l0 17 4.5-4.2 3.2 7 3-1.4-3.2-6.8 6.2-.3z" fill="#1F2433" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></g>
</g>
</svg>
