<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>Store events flowing out to analytics destinations while a sales chart draws itself.</title>
<style>
.an-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.an-b0{animation:an-d0 11s ease-in-out infinite alternate}.an-b1{animation:an-d1 9s ease-in-out infinite alternate}.an-b2{animation:an-d0 12s ease-in-out infinite alternate-reverse}
@keyframes an-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes an-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.an-line{stroke-dasharray:240;animation:an-draw 5s ease-in-out infinite}
@keyframes an-draw{0%{stroke-dashoffset:240}45%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:-240}}
.an-dot{animation:an-fly 2.6s ease-in infinite;opacity:0}
.an-d2{animation-delay:.85s}.an-d3{animation-delay:1.7s}
@keyframes an-fly{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(84px,0)}}
.an-pulse{transform-box:fill-box;transform-origin:center;animation:an-p 2.6s ease-in-out infinite}
.an-p2{animation-delay:.85s}.an-p3{animation-delay:1.7s}
@keyframes an-p{0%,80%{transform:scale(1)}90%{transform:scale(1.18)}100%{transform:scale(1)}}
}
</style>
<defs><linearGradient id="an-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#7C3AED"/></linearGradient><linearGradient id="an-a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></linearGradient><radialGradient id="an-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="an-r1"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="an-r2"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="an-b0" cx="40" cy="10" r="130" fill="url(#an-r0)"/>
<circle class="an-b1" cx="300" cy="170" r="130" fill="url(#an-r1)"/>
<circle class="an-b2" cx="200" cy="-10" r="100" fill="url(#an-r2)"/>
<g class="an-f" font-size="10">
<rect x="18" y="23" width="168" height="138" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="18" y="20" width="168" height="138" rx="12" fill="#fff"/>
<text x="32" y="40" fill="#6B7280">Sales today</text>
<text x="32" y="60" fill="#1F2433" font-size="18" font-weight="700">$4,280</text>
<rect x="110" y="47" width="42" height="16" rx="8" fill="#DCFCE7"/><text x="131" y="58.5" fill="#15803D" font-weight="600" text-anchor="middle">+18%</text>
<path d="M30 140 L52 128 L74 132 L96 112 L118 116 L140 94 L172 80 L172 146 L30 146Z" fill="url(#an-a)"/>
<path class="an-line" d="M30 140 L52 128 L74 132 L96 112 L118 116 L140 94 L172 80" fill="none" stroke="url(#an-g)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g>
<circle class="an-dot" cx="196" cy="52" r="4" fill="#7C3AED"/>
<circle class="an-dot an-d2" cx="196" cy="90" r="4" fill="#EC4899"/>
<circle class="an-dot an-d3" cx="196" cy="128" r="4" fill="#F59E0B"/>
</g>
<g class="an-pulse"><rect x="282" y="36" width="30" height="32" rx="9" fill="#fff"/><rect x="290" y="49" width="4" height="12" rx="2" fill="#F59E0B"/><rect x="296" y="45" width="4" height="16" rx="2" fill="#F97316"/><rect x="302" y="41" width="4" height="20" rx="2" fill="#EA580C"/></g>
<g class="an-pulse an-p2"><rect x="282" y="74" width="30" height="32" rx="9" fill="#fff"/><path d="M289 92c2.5-7 5-7 8 0s5.5 7 8 0" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/></g>
<g class="an-pulse an-p3"><rect x="282" y="112" width="30" height="32" rx="9" fill="#fff"/><path d="M299 119v13a4 4 0 1 1-4-4" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round"/><path d="M299 119c1 3 3 5 6 5" fill="none" stroke="#EC4899" stroke-width="2.5" stroke-linecap="round"/></g>
</g>
</svg>
