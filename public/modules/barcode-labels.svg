<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A sheet of product labels with prices; each barcode is drawn bar by bar.</title>
<style>
.bl-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.bl-b0{animation:bl-d0 11s ease-in-out infinite alternate}.bl-b1{animation:bl-d1 9s ease-in-out infinite alternate}.bl-b2{animation:bl-d0 12s ease-in-out infinite alternate-reverse}
@keyframes bl-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes bl-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.bl-c{transform-box:fill-box;transform-origin:right;animation:bl-draw 5s ease-in-out infinite}
.bl-d2{animation-delay:.4s}.bl-d3{animation-delay:.8s}.bl-d4{animation-delay:1.2s}
@keyframes bl-draw{0%,6%{opacity:0;transform:scaleX(1)}10%{opacity:1;transform:scaleX(1)}40%{opacity:1;transform:scaleX(0)}100%{opacity:1;transform:scaleX(0)}}
}
</style>
