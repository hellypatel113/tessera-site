<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>Three products joined by plus signs, with one "Add bundle" button that saves $6.</title>
<style>
.bd-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.bd-b0{animation:bd-d0 11s ease-in-out infinite alternate}.bd-b1{animation:bd-d1 9s ease-in-out infinite alternate}.bd-b2{animation:bd-d0 12s ease-in-out infinite alternate-reverse}
@keyframes bd-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes bd-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.bd-p{animation:bd-lift 4.5s ease-in-out infinite}
.bd-p2{animation-delay:.35s}.bd-p3{animation-delay:.7s}
@keyframes bd-lift{0%,40%,100%{transform:translateY(0)}20%{transform:translateY(-5px)}}
.bd-tag{transform-box:fill-box;transform-origin:center;animation:bd-pop 4.5s ease-in-out infinite}
@keyframes bd-pop{0%,45%,100%{transform:scale(1)}58%{transform:scale(1.12)}70%{transform:scale(1)}}
}
</style>
<defs><linearGradient id="bd-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2600C"/><stop offset="1" stop-color="#F7A21B"/></linearGradient><radialGradient id="bd-r0"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><radialGradient id="bd-r1"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="bd-r2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="bd-b0" cx="290" cy="20" r="130" fill="url(#bd-r0)"/>
<circle class="bd-b1" cx="20" cy="170" r="140" fill="url(#bd-r1)"/>
<circle class="bd-b2" cx="170" cy="190" r="90" fill="url(#bd-r2)"/>
<rect x="20" y="21" width="280" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="280" height="144" rx="12" fill="#fff"/>
<g class="bd-f" font-size="11">
<g class="bd-p">
<rect x="47" y="32" width="62" height="62" rx="9" fill="#FFE9D6"/>
<circle cx="78" cy="63" r="17" fill="url(#bd-g)" opacity=".75"/>
<text x="78" y="110" fill="#6B7280" text-anchor="middle">$18</text>
</g>
<g class="bd-p bd-p2">
<rect x="129" y="32" width="62" height="62" rx="9" fill="#FFE9D6"/>
<path d="M160 45 L178 78 H142 Z" fill="url(#bd-g)" opacity=".6"/>
<text x="160" y="110" fill="#6B7280" text-anchor="middle">$12</text>
</g>
<g class="bd-p bd-p3">
<rect x="211" y="32" width="62" height="62" rx="9" fill="#FFE9D6"/>
<rect x="228" y="48" width="28" height="30" rx="6" fill="#B6400B" opacity=".55"/>
<text x="242" y="110" fill="#6B7280" text-anchor="middle">$9</text>
</g>
<path d="M119 57v12M113 63h12M201 57v12M195 63h12" stroke="#EA580C" stroke-width="2.4" stroke-linecap="round"/>
<rect x="64" y="124" width="192" height="26" rx="13" fill="url(#bd-g)"/>
<text x="148" y="141" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Add bundle  $33</text>
<g class="bd-tag">
<rect x="230" y="113" width="58" height="19" rx="9.5" fill="#B6400B" stroke="#fff" stroke-width="2"/>
<text x="259" y="126.5" fill="#fff" font-weight="600" text-anchor="middle">Save $6</text>
</g>
</g>
</svg>
