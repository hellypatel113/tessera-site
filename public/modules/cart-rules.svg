<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A cart: when a second item is added, a wrapped gift box drops in marked FREE.</title>
<style>
.cr-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.cr-b0{animation:cr-d0 11s ease-in-out infinite alternate}.cr-b1{animation:cr-d1 9s ease-in-out infinite alternate}.cr-b2{animation:cr-d0 12s ease-in-out infinite alternate-reverse}
@keyframes cr-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes cr-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.cr-i2{animation:cr-a 6s ease-in-out infinite}
.cr-g{animation:cr-b 6s ease-in-out infinite}
.cr-bar{transform-box:fill-box;transform-origin:left;animation:cr-c 6s ease-in-out infinite}
@keyframes cr-a{0%,4%{opacity:1;transform:translateY(0)}10%,16%{opacity:0;transform:translateY(-16px)}28%,100%{opacity:1;transform:translateY(0)}}
@keyframes cr-b{0%,4%{opacity:1;transform:translateY(0)}10%,42%{opacity:0;transform:translateY(-26px)}56%,100%{opacity:1;transform:translateY(0)}}
@keyframes cr-c{0%,4%{transform:scaleX(1)}10%,18%{transform:scaleX(.5)}30%,100%{transform:scaleX(1)}}
}
</style>
<defs><linearGradient id="cr-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><radialGradient id="cr-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="cr-r1"><stop offset="0" stop-color="#E879F9" stop-opacity=".75"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/></radialGradient><radialGradient id="cr-r2"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="cr-b0" cx="20" cy="100" r="120" fill="url(#cr-r0)"/>
<circle class="cr-b1" cx="280" cy="40" r="130" fill="url(#cr-r1)"/>
<circle class="cr-b2" cx="200" cy="190" r="110" fill="url(#cr-r2)"/>
<rect x="64" y="15" width="192" height="156" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="64" y="12" width="192" height="156" rx="12" fill="#fff"/>
<g class="cr-f" font-size="11">
<text x="80" y="35" fill="#1F2433" font-size="12" font-weight="600">Cart</text>
<path d="M226 26h3l3 10h12l2-7h-15" fill="none" stroke="#1F2433" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="234" cy="39.5" r="1.6" fill="#1F2433"/><circle cx="243" cy="39.5" r="1.6" fill="#1F2433"/>
<rect x="80" y="44" width="160" height="5" rx="2.5" fill="#EBEEF1"/>
<rect class="cr-bar" x="80" y="44" width="160" height="5" rx="2.5" fill="url(#cr-g)"/>
<rect x="80" y="58" width="30" height="30" rx="7" fill="#DCEBFF"/>
<circle cx="95" cy="73" r="8" fill="url(#cr-g)" opacity=".7"/>
<rect x="118" y="64" width="62" height="6" rx="3" fill="#DDE1E6"/>
<rect x="118" y="76" width="38" height="6" rx="3" fill="#EBEEF1"/>
<text x="240" y="77" fill="#1F2433" text-anchor="end">$28</text>
<g class="cr-i2">
<rect x="80" y="94" width="30" height="30" rx="7" fill="#DCEBFF"/>
<rect x="88" y="101" width="14" height="16" rx="4" fill="#1E40AF" opacity=".55"/>
<rect x="118" y="100" width="54" height="6" rx="3" fill="#DDE1E6"/>
<rect x="118" y="112" width="34" height="6" rx="3" fill="#EBEEF1"/>
<text x="240" y="113" fill="#1F2433" text-anchor="end">$22</text>
</g>
<g class="cr-g">
<rect x="80" y="130" width="30" height="30" rx="7" fill="url(#cr-g)" opacity=".14"/>
<rect x="85" y="140" width="20" height="15" rx="2.5" fill="url(#cr-g)"/>
<rect x="84" y="137" width="22" height="5" rx="1.5" fill="#1E40AF"/>
<rect x="93.5" y="137" width="3" height="18" fill="#fff" opacity=".85"/>
<path d="M95 137c-4-6-9-3-5 0M95 137c4-6 9-3 5 0" fill="none" stroke="#1E40AF" stroke-width="1.6" stroke-linecap="round"/>
<rect x="118" y="136" width="58" height="6" rx="3" fill="#DDE1E6"/>
<text x="118" y="155" fill="#1E40AF" font-size="10">Free gift</text>
<rect x="200" y="137" width="42" height="17" rx="8.5" fill="url(#cr-g)"/>
<text x="221" y="149.5" fill="#fff" font-weight="600" text-anchor="middle">FREE</text>
</g>
</g>
</svg>
