<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A checkout with a $38 subtotal shows a friendly "Minimum order $50" warning and the pay button is blocked.</title>
<style>
.ck-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.ck-b0{animation:ck-d0 11s ease-in-out infinite alternate}.ck-b1{animation:ck-d1 9s ease-in-out infinite alternate}.ck-b2{animation:ck-d0 12s ease-in-out infinite alternate-reverse}
@keyframes ck-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes ck-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.ck-warn{animation:ck-w 5.5s ease-in-out infinite}
@keyframes ck-w{0%,60%{opacity:1;transform:translateY(0)}70%,78%{opacity:0;transform:translateY(-8px)}88%,100%{opacity:1;transform:translateY(0)}}
}
</style>
<defs><linearGradient id="ck-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#6366F1"/></linearGradient><radialGradient id="ck-r0"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="ck-r1"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><radialGradient id="ck-r2"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="ck-b0" cx="290" cy="20" r="130" fill="url(#ck-r0)"/>
<circle class="ck-b1" cx="20" cy="170" r="140" fill="url(#ck-r1)"/>
<circle class="ck-b2" cx="170" cy="190" r="90" fill="url(#ck-r2)"/>
<rect x="40" y="15" width="240" height="154" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="40" y="12" width="240" height="154" rx="12" fill="#fff"/>
<g class="ck-f" font-size="11">
<rect x="56" y="26" width="28" height="28" rx="7" fill="#E0ECFF"/><circle cx="70" cy="40" r="7" fill="url(#ck-g)" opacity=".7"/>
<rect x="92" y="32" width="80" height="6" rx="3" fill="#DDE1E6"/><rect x="92" y="43" width="50" height="6" rx="3" fill="#EBEEF1"/>
<text x="264" y="44" fill="#1F2433" text-anchor="end">$38</text>
<path d="M56 64h208" stroke="#EBEEF1"/>
<text x="56" y="82" fill="#6B7280">Subtotal</text>
<text x="264" y="82" fill="#1F2433" font-weight="600" text-anchor="end">$38</text>
<g class="ck-warn">
<rect x="56" y="94" width="208" height="28" rx="8" fill="#FFF3D1" stroke="#F2C14E"/>
<circle cx="72" cy="108" r="7" fill="#D97706"/>
<rect x="71" y="103.5" width="2" height="5.5" rx="1" fill="#fff"/><circle cx="72" cy="111.8" r="1.2" fill="#fff"/>
<text x="86" y="112" fill="#8A4B05" font-weight="600">Minimum order $50</text>
</g>
<rect x="56" y="132" width="208" height="24" rx="12" fill="#EBEEF1"/>
<rect x="134" y="141" width="10" height="8" rx="2" fill="#8A929C"/><path d="M136 141.5v-2a3 3 0 0 1 6 0v2" fill="none" stroke="#8A929C" stroke-width="1.5"/>
<text x="150" y="148" fill="#6B7280" font-weight="600">Pay now</text>
</g>
</svg>
