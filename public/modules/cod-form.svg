<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A product page where a cash on delivery order form slides in, asking for name, phone and address.</title>
<style>
.cf-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.cf-b0{animation:cf-d0 11s ease-in-out infinite alternate}.cf-b1{animation:cf-d1 9s ease-in-out infinite alternate}.cf-b2{animation:cf-d0 12s ease-in-out infinite alternate-reverse}
@keyframes cf-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes cf-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.cf-form{animation:cf-in 5.5s ease-in-out infinite}
@keyframes cf-in{0%,70%{opacity:1;transform:translateX(0)}80%,86%{opacity:0;transform:translateX(70px)}100%{opacity:1;transform:translateX(0)}}
}
</style>
<defs><linearGradient id="cf-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#0891B2"/></linearGradient><radialGradient id="cf-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="cf-r1"><stop offset="0" stop-color="#E879F9" stop-opacity=".75"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/></radialGradient><radialGradient id="cf-r2"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="cf-b0" cx="20" cy="100" r="120" fill="url(#cf-r0)"/>
<circle class="cf-b1" cx="280" cy="40" r="130" fill="url(#cf-r1)"/>
<circle class="cf-b2" cx="200" cy="190" r="110" fill="url(#cf-r2)"/>
<rect x="18" y="21" width="160" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="18" y="18" width="160" height="144" rx="12" fill="#fff"/>
<g class="cf-f" font-size="11">
<rect x="30" y="30" width="78" height="78" rx="9" fill="#D6F5EA"/>
<path d="M50 52h38v38H50z" fill="url(#cf-g)" opacity=".6" transform="rotate(8 69 71)"/>
<rect x="30" y="118" width="64" height="7" rx="3.5" fill="#DDE1E6"/>
<text x="30" y="145" fill="#1F2433" font-size="13" font-weight="600">$29</text>
<g class="cf-form">
<rect x="128" y="15" width="176" height="154" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="128" y="12" width="176" height="154" rx="12" fill="#fff"/>
<text x="142" y="33" fill="#1F2433" font-size="12" font-weight="600">Cash on delivery</text>
<rect x="142" y="42" width="148" height="24" rx="6" fill="#fff" stroke="#D3D7DD"/>
<circle cx="154" cy="51.5" r="3.2" fill="url(#cf-g)"/><path d="M148.5 60c1-4 10-4 11 0z" fill="url(#cf-g)"/><rect x="166" y="51" width="62" height="6" rx="3" fill="#DDE1E6"/>
<rect x="142" y="72" width="148" height="24" rx="6" fill="#fff" stroke="#D3D7DD"/>
<rect x="150.5" y="77.5" width="8" height="13" rx="2" fill="none" stroke="#0E9F7E" stroke-width="1.6"/><rect x="166" y="81" width="54" height="6" rx="3" fill="#DDE1E6"/>
<rect x="142" y="102" width="148" height="24" rx="6" fill="#fff" stroke="#D3D7DD"/>
<path d="M154.5 120s-5-5.5-5-9a5 5 0 0 1 10 0c0 3.5-5 9-5 9z" fill="url(#cf-g)"/><circle cx="154.5" cy="111" r="1.8" fill="#fff"/><rect x="166" y="111" width="84" height="6" rx="3" fill="#DDE1E6"/>
<rect x="142" y="134" width="148" height="22" rx="11" fill="url(#cf-g)"/>
<text x="216" y="149" fill="#fff" font-weight="600" text-anchor="middle">Place order</text>
</g>
</g>
</svg>
