<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>Checkout payment options Card, PayPal and Cash on delivery; when the cart total rises above a limit, Cash on delivery is hidden.</title>
<style>
.pr-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.pr-b0{animation:pr-d0 11s ease-in-out infinite alternate}.pr-b1{animation:pr-d1 9s ease-in-out infinite alternate}.pr-b2{animation:pr-d0 12s ease-in-out infinite alternate-reverse}
@keyframes pr-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes pr-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.pr-cod{animation:pr-cod 6s ease-in-out infinite}
.pr-off{animation:pr-off 6s ease-in-out infinite}
.pr-hi{animation:pr-hi 6s ease-in-out infinite}
.pr-lo{animation:pr-lo 6s ease-in-out infinite}
@keyframes pr-cod{0%,8%{opacity:.35}18%,52%{opacity:1}62%,100%{opacity:.35}}
@keyframes pr-off{0%,8%{opacity:1}18%,52%{opacity:0}62%,100%{opacity:1}}
@keyframes pr-hi{0%,6%{opacity:1}14%,48%{opacity:0}56%,100%{opacity:1}}
@keyframes pr-lo{0%,6%{opacity:0}14%,48%{opacity:1}56%,100%{opacity:0}}
}
</style>
<defs><linearGradient id="pr-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><radialGradient id="pr-r0"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="pr-r1"><stop offset="0" stop-color="#FDBA74" stop-opacity=".75"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient><radialGradient id="pr-r2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="pr-b0" cx="160" cy="-10" r="120" fill="url(#pr-r0)"/>
<circle class="pr-b1" cx="10" cy="180" r="130" fill="url(#pr-r1)"/>
<circle class="pr-b2" cx="320" cy="150" r="130" fill="url(#pr-r2)"/>
<rect x="30" y="15" width="260" height="154" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="30" y="12" width="260" height="154" rx="12" fill="#fff"/>
<g class="pr-f" font-size="11">
<text x="46" y="37" fill="#1F2433" font-size="12" font-weight="600">Payment</text>
<rect x="206" y="23" width="68" height="20" rx="10" fill="url(#pr-g)"/>
<text class="pr-hi" x="240" y="37" fill="#fff" font-weight="600" text-anchor="middle">$520</text>
<text class="pr-lo" x="240" y="37" fill="#fff" font-weight="600" text-anchor="middle" opacity="0">$80</text>
<rect x="46" y="52" width="228" height="30" rx="8" fill="#fff" stroke="#2563EB" stroke-width="1.6"/>
<circle cx="60" cy="67" r="5.5" fill="none" stroke="#2563EB" stroke-width="1.4"/><circle cx="60" cy="67" r="2.8" fill="url(#pr-g)"/>
<rect x="72" y="61" width="20" height="13" rx="2.5" fill="#1E40AF" opacity=".75"/><rect x="72" y="64" width="20" height="2.5" fill="#fff" opacity=".7"/>
<text x="100" y="71" fill="#1F2433" font-weight="600">Card</text>
<rect x="46" y="88" width="228" height="30" rx="8" fill="#fff" stroke="#E3E6EA"/>
<circle cx="60" cy="103" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<rect x="72" y="97" width="20" height="13" rx="6.5" fill="#DCEBFF"/><text x="82" y="107" fill="#1E40AF" font-size="10" font-weight="600" text-anchor="middle">P</text>
<text x="100" y="107" fill="#1F2433" font-weight="600">PayPal</text>
<g class="pr-cod" opacity=".35">
<rect x="46" y="124" width="228" height="30" rx="8" fill="#fff" stroke="#E3E6EA"/>
<circle cx="60" cy="139" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<rect x="72" y="133" width="20" height="13" rx="2.5" fill="none" stroke="#1E40AF" stroke-width="1.4"/><circle cx="82" cy="139.5" r="2.6" fill="#1E40AF"/>
<text x="100" y="143" fill="#1F2433" font-weight="600">Cash on delivery</text>
</g>
<g class="pr-off">
<rect x="226" y="131" width="40" height="16" rx="8" fill="#EBEEF1"/>
<text x="246" y="142.5" fill="#6B7280" font-size="10" font-weight="600" text-anchor="middle">Hidden</text>
</g>
</g>
</svg>
