<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A store page with a cookie consent bar sliding up from the bottom, offering Accept and Decline.</title>
<style>
.cc-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.cc-b0{animation:cc-d0 11s ease-in-out infinite alternate}.cc-b1{animation:cc-d1 9s ease-in-out infinite alternate}.cc-b2{animation:cc-d0 12s ease-in-out infinite alternate-reverse}
@keyframes cc-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes cc-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.cc-bar{animation:cc-up 5.5s ease-in-out infinite}
@keyframes cc-up{0%,68%{opacity:1;transform:translateY(0)}78%,86%{opacity:0;transform:translateY(40px)}100%{opacity:1;transform:translateY(0)}}
}
</style>
<defs><linearGradient id="cc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2600C"/><stop offset="1" stop-color="#F7A21B"/></linearGradient><radialGradient id="cc-r0"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="cc-r1"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><radialGradient id="cc-r2"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="cc-b0" cx="290" cy="20" r="130" fill="url(#cc-r0)"/>
<circle class="cc-b1" cx="20" cy="170" r="140" fill="url(#cc-r1)"/>
<circle class="cc-b2" cx="170" cy="190" r="90" fill="url(#cc-r2)"/>
<rect x="16" y="13" width="288" height="158" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="16" y="10" width="288" height="158" rx="12" fill="#fff"/>
<g class="cc-f" font-size="11">
<rect x="28" y="22" width="44" height="8" rx="4" fill="#1F2433" opacity=".8"/>
<rect x="196" y="23" width="26" height="6" rx="3" fill="#DDE1E6"/><rect x="230" y="23" width="26" height="6" rx="3" fill="#DDE1E6"/><rect x="264" y="23" width="26" height="6" rx="3" fill="#DDE1E6"/>
<rect x="28" y="40" width="264" height="56" rx="9" fill="#FFE9D6"/>
<rect x="44" y="56" width="90" height="9" rx="4.5" fill="#B6400B" opacity=".55"/>
<rect x="44" y="71" width="60" height="7" rx="3.5" fill="#B6400B" opacity=".3"/>
<circle cx="250" cy="68" r="18" fill="url(#cc-g)" opacity=".6"/>
<rect x="28" y="104" width="60" height="36" rx="7" fill="#EBEEF1"/><rect x="96" y="104" width="60" height="36" rx="7" fill="#EBEEF1"/><rect x="164" y="104" width="60" height="36" rx="7" fill="#EBEEF1"/><rect x="232" y="104" width="60" height="36" rx="7" fill="#EBEEF1"/>
<g class="cc-bar">
<rect x="22" y="117" width="276" height="44" rx="11" fill="#1F2433" opacity=".14"/>
<rect x="22" y="114" width="276" height="44" rx="11" fill="#fff" stroke="#E3E6EA"/>
<circle cx="42" cy="136" r="10" fill="#E2B675"/>
<circle cx="38.5" cy="132.5" r="1.8" fill="#8A5A1E"/><circle cx="45" cy="135" r="1.6" fill="#8A5A1E"/><circle cx="40" cy="140" r="1.6" fill="#8A5A1E"/>
<circle cx="51" cy="128" r="3.4" fill="#fff"/>
<rect x="60" y="128" width="78" height="6" rx="3" fill="#DDE1E6"/><rect x="60" y="139" width="56" height="6" rx="3" fill="#EBEEF1"/>
<rect x="150" y="124" width="64" height="24" rx="12" fill="#fff" stroke="#C9CED5"/>
<text x="182" y="140" fill="#1F2433" font-weight="600" text-anchor="middle">Decline</text>
<rect x="220" y="124" width="66" height="24" rx="12" fill="url(#cc-g)"/>
<text x="253" y="140" fill="#fff" font-weight="600" text-anchor="middle">Accept</text>
</g>
</g>
</svg>
