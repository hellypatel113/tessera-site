<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
  <title>A store page with a new feature appearing</title>
  <defs>
    <radialGradient id="fb-violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fb-coral" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fb-sky" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fb-pill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .fb-blob-a { animation: fb-drift-a 10s ease-in-out infinite; }
      .fb-blob-b { animation: fb-drift-b 12s ease-in-out infinite; }
      .fb-blob-c { animation: fb-drift-c 9s ease-in-out infinite; }
      .fb-new { animation: fb-pop 4s ease-in-out infinite; transform-origin: 236px 92px; }
      .fb-spark { animation: fb-twinkle 4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .fb-spark-2 { animation-delay: 0.6s; }
      .fb-spark-3 { animation-delay: 1.2s; }
    }
    @keyframes fb-drift-a { 50% { transform: translate(18px, 10px); } }
    @keyframes fb-drift-b { 50% { transform: translate(-16px, -8px); } }
    @keyframes fb-drift-c { 50% { transform: translate(10px, -12px); } }
    @keyframes fb-pop { 0%, 55%, 100% { transform: scale(1); opacity: 1; } 75% { transform: scale(0.93); opacity: 0.55; } }
    @keyframes fb-twinkle { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.6); } }
  </style>
  <rect width="320" height="180" fill="#faf7ff"/>
  <circle class="fb-blob-a" cx="60" cy="40" r="120" fill="url(#fb-violet)"/>
  <circle class="fb-blob-b" cx="280" cy="150" r="120" fill="url(#fb-coral)"/>
  <circle class="fb-blob-c" cx="250" cy="20" r="90" fill="url(#fb-sky)"/>

  <rect x="42" y="34" width="176" height="118" rx="12" fill="#1f1235" opacity="0.06"/>
  <rect x="38" y="30" width="176" height="118" rx="12" fill="#ffffff"/>
  <rect x="38" y="30" width="176" height="22" rx="12" fill="#f3f0fa"/>
  <circle cx="52" cy="41" r="3" fill="#fb7185"/>
  <circle cx="62" cy="41" r="3" fill="#fbbf24"/>
  <circle cx="72" cy="41" r="3" fill="#34d399"/>
  <rect x="52" y="64" width="56" height="56" rx="8" fill="#ede9fe"/>
  <path d="M60 110 L74 92 L84 104 L90 97 L102 110 Z" fill="#a78bfa"/>
  <circle cx="92" cy="80" r="5" fill="#fbbf24"/>
  <rect x="118" y="66" width="80" height="8" rx="4" fill="#d6d3e0"/>
  <rect x="118" y="80" width="56" height="8" rx="4" fill="#e7e5ee"/>
  <rect x="118" y="104" width="80" height="18" rx="9" fill="url(#fb-pill)"/>
  <rect x="140" y="111" width="36" height="4" rx="2" fill="#ffffff" opacity="0.9"/>

  <g class="fb-new">
    <rect x="200" y="66" width="76" height="52" rx="12" fill="#1f1235" opacity="0.08"/>
    <rect x="196" y="62" width="76" height="52" rx="12" fill="#ffffff"/>
    <rect x="208" y="74" width="22" height="22" rx="7" fill="url(#fb-pill)"/>
    <path d="M214 85 l4 4 l8 -9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="236" y="76" width="26" height="6" rx="3" fill="#d6d3e0"/>
    <rect x="236" y="88" width="18" height="6" rx="3" fill="#e7e5ee"/>
    <rect x="208" y="102" width="52" height="4" rx="2" fill="#f0abfc"/>
  </g>

  <path class="fb-spark" d="M286 50 l2.5 6 l6 2.5 l-6 2.5 l-2.5 6 l-2.5 -6 l-6 -2.5 l6 -2.5 Z" fill="#f59e0b"/>
  <path class="fb-spark fb-spark-2" d="M188 26 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#ec4899"/>
  <path class="fb-spark fb-spark-3" d="M290 132 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2 Z" fill="#38bdf8"/>
</svg>
