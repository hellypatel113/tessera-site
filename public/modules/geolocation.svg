<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A welcome pop-up over a store asks "Shopping from India?" and offers to switch prices to rupees (INR); a location pin bounces on the flag.</title>
<defs><clipPath id="gl-c"><circle cx="160" cy="52" r="15"/></clipPath></defs>
<style>
.gl-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.gl-b0{animation:gl-d0 11s ease-in-out infinite alternate}.gl-b1{animation:gl-d1 9s ease-in-out infinite alternate}.gl-b2{animation:gl-d0 12s ease-in-out infinite alternate-reverse}
@keyframes gl-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes gl-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.gl-pin{animation:gl-pin 2.4s ease-in-out infinite}
@keyframes gl-pin{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.gl-sh{transform-box:fill-box;transform-origin:center;animation:gl-sh 2.4s ease-in-out infinite}
@keyframes gl-sh{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.6);opacity:.18}}
.gl-pop{animation:gl-pop 6s ease-in-out infinite}
@keyframes gl-pop{0%,74%{opacity:1;transform:translateY(0)}82%,88%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
}
</style>
<defs><linearGradient id="gl-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><radialGradient id="gl-r0"><stop offset="0" stop-color="#FDBA74" stop-opacity=".75"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient><radialGradient id="gl-r1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="gl-r2"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="gl-b0" cx="20" cy="100" r="120" fill="url(#gl-r0)"/>
<circle class="gl-b1" cx="280" cy="40" r="130" fill="url(#gl-r1)"/>
<circle class="gl-b2" cx="200" cy="190" r="110" fill="url(#gl-r2)"/>
<rect x="16" y="13" width="288" height="158" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="16" y="10" width="288" height="158" rx="12" fill="#fff"/>
<g opacity=".8">
<rect x="28" y="22" width="44" height="8" rx="4" fill="#DDE1E6"/>
<rect x="28" y="40" width="80" height="80" rx="9" fill="#DCEBFF"/><rect x="120" y="40" width="80" height="80" rx="9" fill="#DCEBFF"/><rect x="212" y="40" width="80" height="80" rx="9" fill="#DCEBFF"/>
<rect x="28" y="130" width="60" height="7" rx="3.5" fill="#DDE1E6"/><rect x="120" y="130" width="50" height="7" rx="3.5" fill="#DDE1E6"/><rect x="212" y="130" width="64" height="7" rx="3.5" fill="#DDE1E6"/>
</g>
<rect x="16" y="10" width="288" height="158" rx="12" fill="#1F2433" opacity=".16"/>
<g class="gl-f gl-pop" font-size="11">
<rect x="68" y="25" width="184" height="134" rx="12" fill="#1F2433" opacity=".18"/>
<rect x="68" y="22" width="184" height="134" rx="12" fill="#fff"/>
<g clip-path="url(#gl-c)"><rect x="140" y="36" width="40" height="11" fill="#F4A340"/><rect x="140" y="47" width="40" height="10" fill="#fff"/><rect x="140" y="57" width="40" height="11" fill="#2FA05A"/><circle cx="160" cy="52" r="3" fill="none" stroke="#2B3A8C" stroke-width="1.2"/></g>
<circle cx="160" cy="52" r="15" fill="none" stroke="#E3E6EA"/>
<ellipse class="gl-sh" cx="178" cy="46" rx="5" ry="1.6" fill="#1F2433"/>
<g class="gl-pin"><path d="M178 44s-7-7.2-7-12a7 7 0 0 1 14 0c0 4.8-7 12-7 12z" fill="url(#gl-g)" stroke="#fff" stroke-width="1.4"/><circle cx="178" cy="32" r="2.4" fill="#fff"/></g>
<text x="160" y="88" fill="#1F2433" font-size="13" font-weight="600" text-anchor="middle">Shopping from India?</text>
<circle cx="117" cy="105" r="8" fill="#DCEBFF"/>
<text x="117" y="109" fill="#1E40AF" font-weight="600" text-anchor="middle">₹</text>
<rect x="131" y="102" width="74" height="6" rx="3" fill="#DDE1E6"/>
<rect x="96" y="120" width="128" height="26" rx="13" fill="url(#gl-g)"/>
<text x="160" y="137" fill="#fff" font-weight="600" text-anchor="middle">Switch to INR</text>
</g>
</svg>
