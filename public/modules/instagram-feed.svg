<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A social photo feed embedded in the store: a three by two grid of colourful posts, one of them a video, with a small camera badge.</title>
<style>
.if-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.if-b0{animation:if-d0 11s ease-in-out infinite alternate}.if-b1{animation:if-d1 9s ease-in-out infinite alternate}.if-b2{animation:if-d0 12s ease-in-out infinite alternate-reverse}
@keyframes if-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes if-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.if-sh{animation:if-sh 6s ease-in-out infinite}
.if-d1{animation-delay:.5s}.if-d2{animation-delay:1s}.if-d3{animation-delay:1.5s}.if-d4{animation-delay:2s}.if-d5{animation-delay:2.5s}
@keyframes if-sh{0%,100%{opacity:0}8%{opacity:.55}20%{opacity:0}}
}
</style>
