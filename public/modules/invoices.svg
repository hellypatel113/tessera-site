<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>An invoice and a packing slip fanning out from a stack, ready to print.</title>
<style>
.iv-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.iv-b0{animation:iv-d0 11s ease-in-out infinite alternate}.iv-b1{animation:iv-d1 9s ease-in-out infinite alternate}.iv-b2{animation:iv-d0 12s ease-in-out infinite alternate-reverse}
@keyframes iv-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes iv-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.iv-a{transform-box:fill-box;transform-origin:50% 100%;animation:iv-a 5s ease-in-out infinite}
.iv-b{transform-box:fill-box;transform-origin:50% 100%;animation:iv-b 5s ease-in-out infinite}
@keyframes iv-a{0%,30%{transform:translateX(0) rotate(0)}48%,62%{transform:translateX(34px) rotate(6deg)}80%,100%{transform:translateX(0) rotate(0)}}
@keyframes iv-b{0%,30%{transform:translateX(0) rotate(0)}48%,62%{transform:translateX(-34px) rotate(-6deg)}80%,100%{transform:translateX(0) rotate(0)}}
}
</style>
<defs><linearGradient id="iv-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient><radialGradient id="iv-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="iv-r1"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="iv-r2"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="iv-b0" cx="160" cy="-10" r="120" fill="url(#iv-r0)"/>
<circle class="iv-b1" cx="10" cy="180" r="130" fill="url(#iv-r1)"/>
<circle class="iv-b2" cx="320" cy="150" r="130" fill="url(#iv-r2)"/>
<g class="iv-f" font-size="11">
<g class="iv-b">
<rect x="58" y="21" width="112" height="146" rx="10" fill="#1E1B4B" opacity=".09"/>
<rect x="58" y="18" width="112" height="146" rx="10" fill="#fff"/>
<text x="70" y="38" fill="#1F2433" font-weight="600">Packing slip</text>
<rect x="70" y="50" width="10" height="10" rx="2.5" fill="none" stroke="#7C3AED" stroke-width="1.5"/><rect x="86" y="52" width="56" height="6" rx="3" fill="#DDE1E6"/>
<rect x="70" y="68" width="10" height="10" rx="2.5" fill="none" stroke="#7C3AED" stroke-width="1.5"/><rect x="86" y="70" width="44" height="6" rx="3" fill="#DDE1E6"/>
<rect x="70" y="86" width="10" height="10" rx="2.5" fill="none" stroke="#7C3AED" stroke-width="1.5"/><rect x="86" y="88" width="50" height="6" rx="3" fill="#DDE1E6"/>
<rect x="70" y="112" width="60" height="6" rx="3" fill="#EBEEF1"/><rect x="70" y="124" width="76" height="6" rx="3" fill="#EBEEF1"/><rect x="70" y="136" width="40" height="6" rx="3" fill="#EBEEF1"/>
</g>
<g class="iv-a">
<rect x="150" y="21" width="112" height="146" rx="10" fill="#1E1B4B" opacity=".09"/>
<rect x="150" y="18" width="112" height="146" rx="10" fill="#fff"/>
<path d="M150 28a10 10 0 0 1 10-10h92a10 10 0 0 1 10 10z" fill="url(#iv-g)"/>
<text x="162" y="42" fill="#1F2433" font-size="12" font-weight="600">Invoice</text>
<text x="250" y="42" fill="#6B7280" font-size="10" text-anchor="end">#1042</text>
<rect x="162" y="54" width="50" height="6" rx="3" fill="#DDE1E6"/><rect x="162" y="64" width="36" height="6" rx="3" fill="#EBEEF1"/>
<path d="M162 80h88M162 98h88M162 116h88" stroke="#EBEEF1"/>
<rect x="162" y="86" width="50" height="6" rx="3" fill="#DDE1E6"/><rect x="232" y="86" width="18" height="6" rx="3" fill="#DDE1E6"/>
<rect x="162" y="104" width="40" height="6" rx="3" fill="#DDE1E6"/><rect x="232" y="104" width="18" height="6" rx="3" fill="#DDE1E6"/>
<text x="162" y="140" fill="#6B7280">Total</text>
<text x="250" y="140" fill="#5B21B6" font-size="13" font-weight="600" text-anchor="end">$86</text>
</g>
</g>
</svg>
