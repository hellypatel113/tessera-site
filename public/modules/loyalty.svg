<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A points balance counts up to 500 and turns into a $10 off reward coupon.</title>
<style>
.ly-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.ly-b0{animation:ly-d0 11s ease-in-out infinite alternate}.ly-b1{animation:ly-d1 9s ease-in-out infinite alternate}.ly-b2{animation:ly-d0 12s ease-in-out infinite alternate-reverse}
@keyframes ly-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes ly-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.ly-n1{animation:ly-a 6s ease-in-out infinite}
.ly-n2{animation:ly-b 6s ease-in-out infinite}
.ly-n3{animation:ly-c 6s ease-in-out infinite}
.ly-bar{transform-box:fill-box;transform-origin:left;animation:ly-d 6s ease-in-out infinite}
.ly-cp{animation:ly-e 6s ease-in-out infinite}
@keyframes ly-a{0%,6%{opacity:0}12%,26%{opacity:1}32%,100%{opacity:0}}
@keyframes ly-b{0%,26%{opacity:0}32%,42%{opacity:1}48%,100%{opacity:0}}
@keyframes ly-c{0%,4%{opacity:1}10%,42%{opacity:0}48%,100%{opacity:1}}
@keyframes ly-d{0%,4%{transform:scaleX(1)}12%,20%{transform:scaleX(.24)}36%{transform:scaleX(.7)}46%,100%{transform:scaleX(1)}}
@keyframes ly-e{0%,4%{opacity:1;transform:translateX(0)}10%,50%{opacity:0;transform:translateX(-14px)}62%,100%{opacity:1;transform:translateX(0)}}
}
</style>
<defs><linearGradient id="ly-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D9258A"/><stop offset="1" stop-color="#F9735B"/></linearGradient><radialGradient id="ly-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="ly-r1"><stop offset="0" stop-color="#E879F9" stop-opacity=".75"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/></radialGradient><radialGradient id="ly-r2"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="ly-b0" cx="20" cy="100" r="120" fill="url(#ly-r0)"/>
<circle class="ly-b1" cx="280" cy="40" r="130" fill="url(#ly-r1)"/>
<circle class="ly-b2" cx="200" cy="190" r="110" fill="url(#ly-r2)"/>
<g class="ly-f" font-size="11">
<rect x="20" y="31" width="146" height="124" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="28" width="146" height="124" rx="12" fill="#fff"/>
<circle cx="44" cy="52" r="10" fill="#FDE2EF"/>
<path d="M44 46.5l1.7 3.5 3.8.5-2.8 2.6.7 3.8-3.4-1.8-3.4 1.8.7-3.8-2.8-2.6 3.8-.5z" fill="url(#ly-g)"/>
<text x="60" y="56" fill="#6B7280">Points</text>
<text class="ly-n1" x="34" y="104" fill="#1F2433" font-size="32" font-weight="600" opacity="0">120</text>
<text class="ly-n2" x="34" y="104" fill="#1F2433" font-size="32" font-weight="600" opacity="0">350</text>
<text class="ly-n3" x="34" y="104" fill="#1F2433" font-size="32" font-weight="600">500</text>
<rect x="34" y="120" width="118" height="7" rx="3.5" fill="#EBEEF1"/>
<rect class="ly-bar" x="34" y="120" width="118" height="7" rx="3.5" fill="url(#ly-g)"/>
<path d="M174 90h18m-6-6l6 6-6 6" fill="none" stroke="#D9258A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
<g class="ly-cp">
<path d="M202 56h88a8 8 0 0 1 8 8v12a8 8 0 0 0 0 16v12a8 8 0 0 1-8 8h-88a8 8 0 0 1-8-8V92a8 8 0 0 0 0-16V64a8 8 0 0 1 8-8z" fill="#1E1B4B" opacity=".09" transform="translate(0 3)"/>
<path d="M202 56h88a8 8 0 0 1 8 8v12a8 8 0 0 0 0 16v12a8 8 0 0 1-8 8h-88a8 8 0 0 1-8-8V92a8 8 0 0 0 0-16V64a8 8 0 0 1 8-8z" fill="url(#ly-g)"/>
<path d="M226 62v100" stroke="#fff" stroke-width="1.4" stroke-dasharray="3 4" opacity=".6" transform="scale(1 .5) translate(0 62)"/>
<text x="258" y="86" fill="#fff" font-size="20" font-weight="600" text-anchor="middle">$10</text>
<text x="258" y="103" fill="#fff" font-size="11" font-weight="600" text-anchor="middle" opacity=".9">off</text>
</g>
</g>
</svg>
