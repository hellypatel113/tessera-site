<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>An order tracking timeline from Ordered to Shipped to Out for delivery, with a delivery van moving along it.</title>
<style>
.ot-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.ot-b0{animation:ot-d0 11s ease-in-out infinite alternate}.ot-b1{animation:ot-d1 9s ease-in-out infinite alternate}.ot-b2{animation:ot-d0 12s ease-in-out infinite alternate-reverse}
@keyframes ot-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes ot-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.ot-van{animation:ot-van 6s ease-in-out infinite}
.ot-bar{transform-box:fill-box;transform-origin:left;animation:ot-bar 6s ease-in-out infinite}
@keyframes ot-van{0%,14%{opacity:1;transform:translateX(0)}40%,62%{opacity:1;transform:translateX(98px)}70%{opacity:0;transform:translateX(98px)}74%{opacity:0;transform:translateX(-98px)}80%{opacity:1;transform:translateX(-98px)}96%,100%{opacity:1;transform:translateX(0)}}
@keyframes ot-bar{0%,14%{transform:scaleX(.5)}40%,62%{transform:scaleX(1)}70%{transform:scaleX(1)}74%,80%{transform:scaleX(0)}96%,100%{transform:scaleX(.5)}}
}
</style>
<defs><linearGradient id="ot-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#0891B2"/></linearGradient><radialGradient id="ot-r0"><stop offset="0" stop-color="#FDBA74" stop-opacity=".75"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient><radialGradient id="ot-r1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="ot-r2"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="ot-b0" cx="20" cy="100" r="120" fill="url(#ot-r0)"/>
<circle class="ot-b1" cx="280" cy="40" r="130" fill="url(#ot-r1)"/>
<circle class="ot-b2" cx="200" cy="190" r="110" fill="url(#ot-r2)"/>
<rect x="16" y="23" width="288" height="134" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="16" y="20" width="288" height="134" rx="12" fill="#fff"/>
<g class="ot-f" font-size="11">
<text x="32" y="44" fill="#1F2433" font-size="12" font-weight="600">Order #1042</text>
<rect x="210" y="31" width="78" height="18" rx="9" fill="#D6F5EA"/>
<text x="249" y="43.5" fill="#04704F" font-size="10" font-weight="600" text-anchor="middle">Arrives Fri</text>
<rect x="62" y="104" width="196" height="4" rx="2" fill="#EBEEF1"/>
<rect class="ot-bar" x="62" y="104" width="196" height="4" rx="2" fill="url(#ot-g)" transform="translate(31 0) scale(.5 1)"/>
<circle cx="62" cy="106" r="7" fill="url(#ot-g)"/>
<circle cx="160" cy="106" r="7" fill="url(#ot-g)"/>
<circle cx="258" cy="106" r="7" fill="#fff" stroke="#C9CED5" stroke-width="2"/>
<path d="M58.8 106.2l2.2 2.2 4.2-4.6M156.8 106.2l2.2 2.2 4.2-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="62" y="132" fill="#1F2433" font-size="10.5" font-weight="600" text-anchor="middle">Ordered</text>
<text x="160" y="132" fill="#1F2433" font-size="10.5" font-weight="600" text-anchor="middle">Shipped</text>
<text x="258" y="132" fill="#6B7280" font-size="10.5" text-anchor="middle">Out for delivery</text>
<g class="ot-van">
<rect x="145" y="72" width="22" height="16" rx="3" fill="url(#ot-g)"/>
<path d="M167 76h6l4 5v7h-10z" fill="#04704F"/>
<circle cx="151" cy="89" r="3.2" fill="#1F2433"/><circle cx="171" cy="89" r="3.2" fill="#1F2433"/>
</g>
</g>
</svg>
