<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A product that is not yet in stock: the "Sold out" button turns into "Pre-order", with a note that it ships in March.</title>
<style>
.po-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.po-b0{animation:po-d0 11s ease-in-out infinite alternate}.po-b1{animation:po-d1 9s ease-in-out infinite alternate}.po-b2{animation:po-d0 12s ease-in-out infinite alternate-reverse}
@keyframes po-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes po-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.po-so{animation:po-swap 5s ease-in-out infinite}
.po-note{animation:po-note 5s ease-in-out infinite}
@keyframes po-swap{0%,58%{opacity:0}66%,80%{opacity:1}90%,100%{opacity:0}}
@keyframes po-note{0%,62%{opacity:1;transform:translateY(0)}68%,86%{opacity:0;transform:translateY(4px)}96%,100%{opacity:1;transform:translateY(0)}}
}
</style>
<defs><linearGradient id="po-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#6366F1"/></linearGradient><radialGradient id="po-r0"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="po-r1"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><radialGradient id="po-r2"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="po-b0" cx="290" cy="20" r="130" fill="url(#po-r0)"/>
<circle class="po-b1" cx="20" cy="170" r="140" fill="url(#po-r1)"/>
<circle class="po-b2" cx="170" cy="190" r="90" fill="url(#po-r2)"/>
<rect x="20" y="21" width="280" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="280" height="144" rx="12" fill="#fff"/>
<g class="po-f" font-size="11">
<rect x="32" y="30" width="112" height="120" rx="9" fill="#E0ECFF"/>
<path d="M66 70h44l-6 50H72z" fill="url(#po-g)" opacity=".7"/>
<path d="M76 70c0-14 24-14 24 0" fill="none" stroke="#3443C4" stroke-width="4" opacity=".7"/>
<rect x="160" y="34" width="110" height="8" rx="4" fill="#DDE1E6"/>
<rect x="160" y="48" width="74" height="8" rx="4" fill="#EBEEF1"/>
<text x="160" y="78" fill="#1F2433" font-size="14" font-weight="600">$64</text>
<rect x="160" y="92" width="126" height="28" rx="14" fill="url(#po-g)"/>
<text x="223" y="110" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Pre-order</text>
<g class="po-so" opacity="0">
<rect x="160" y="92" width="126" height="28" rx="14" fill="#C9CED5"/>
<text x="223" y="110" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Sold out</text>
</g>
<g class="po-note">
<rect x="161" y="131" width="15" height="14" rx="3" fill="none" stroke="#4F6BF0" stroke-width="1.5"/>
<path d="M161 135.5h15M165 129v4M172 129v4" stroke="#4F6BF0" stroke-width="1.5" stroke-linecap="round"/>
<text x="183" y="142" fill="#3443C4" font-weight="600">Ships in March</text>
</g>
</g>
</svg>
