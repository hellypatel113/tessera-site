<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A product with an engraving option for $5 extra; a name is typed into the engraving field.</title>
<style>
.pp-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.pp-b0{animation:pp-d0 11s ease-in-out infinite alternate}.pp-b1{animation:pp-d1 9s ease-in-out infinite alternate}.pp-b2{animation:pp-d0 12s ease-in-out infinite alternate-reverse}
@keyframes pp-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes pp-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.pp-cov{animation:pp-type 5s ease-in-out infinite}
.pp-car{animation:pp-blink 1.2s steps(1) infinite}
@keyframes pp-type{0%,12%{transform:translateX(0)}18%,26%{transform:translateX(-30px)}34%{transform:translateX(-19px)}42%{transform:translateX(-14px)}50%,100%{transform:translateX(0)}}
@keyframes pp-blink{0%{opacity:1}50%{opacity:0}}
}
</style>
<defs><linearGradient id="pp-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#0891B2"/></linearGradient><radialGradient id="pp-r0"><stop offset="0" stop-color="#FDBA74" stop-opacity=".75"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient><radialGradient id="pp-r1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="pp-r2"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="pp-b0" cx="20" cy="100" r="120" fill="url(#pp-r0)"/>
<circle class="pp-b1" cx="280" cy="40" r="130" fill="url(#pp-r1)"/>
<circle class="pp-b2" cx="200" cy="190" r="110" fill="url(#pp-r2)"/>
<clipPath id="pp-clip"><rect x="164" y="98" width="118" height="24"/></clipPath>
<rect x="20" y="21" width="280" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="280" height="144" rx="12" fill="#fff"/>
<g class="pp-f" font-size="11">
<rect x="32" y="30" width="112" height="120" rx="9" fill="#D6F5EA"/>
<circle cx="88" cy="96" r="22" fill="none" stroke="#0E9F7E" stroke-width="5" opacity=".75"/>
<path d="M88 56v18" stroke="#04704F" stroke-width="2" opacity=".6"/>
<rect x="160" y="32" width="100" height="8" rx="4" fill="#DDE1E6"/>
<text x="160" y="62" fill="#1F2433" font-size="13" font-weight="600">$45</text>
<rect x="160" y="74" width="12" height="12" rx="3" fill="url(#pp-g)"/>
<path d="M163 80l2.2 2.2 4-4.4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="178" y="84" fill="#1F2433" font-weight="600">Engraving</text>
<rect x="246" y="72" width="40" height="16" rx="8" fill="#D6F5EA"/>
<text x="266" y="84" fill="#04704F" font-weight="600" text-anchor="middle">+ $5</text>
<rect x="160" y="96" width="126" height="28" rx="7" fill="#fff" stroke="#0E9F7E" stroke-width="1.5"/>
<text x="170" y="114.5" fill="#1F2433" font-size="13">Mia</text>
<g clip-path="url(#pp-clip)">
<g class="pp-cov">
<rect x="194" y="98" width="100" height="24" fill="#fff"/>
<rect class="pp-car" x="194" y="103" width="1.5" height="15" fill="url(#pp-g)"/>
</g>
</g>
<rect x="160" y="134" width="126" height="18" rx="9" fill="url(#pp-g)"/>
<text x="223" y="146.5" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Add to cart</text>
</g>
</svg>
