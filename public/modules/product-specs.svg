<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A product next to a neat specification table listing material, size and weight.</title>
<style>
.ps-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.ps-b0{animation:ps-d0 11s ease-in-out infinite alternate}.ps-b1{animation:ps-d1 9s ease-in-out infinite alternate}.ps-b2{animation:ps-d0 12s ease-in-out infinite alternate-reverse}
@keyframes ps-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes ps-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.ps-hl{animation:ps-move 6s ease-in-out infinite}
@keyframes ps-move{0%,22%{transform:translateY(0)}32%,55%{transform:translateY(32px)}65%,88%{transform:translateY(64px)}98%,100%{transform:translateY(0)}}
}
</style>
<defs><linearGradient id="ps-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2600C"/><stop offset="1" stop-color="#F7A21B"/></linearGradient><radialGradient id="ps-r0"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="ps-r1"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="ps-r2"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="ps-b0" cx="40" cy="30" r="130" fill="url(#ps-r0)"/>
<circle class="ps-b1" cx="300" cy="160" r="140" fill="url(#ps-r1)"/>
<circle class="ps-b2" cx="250" cy="10" r="100" fill="url(#ps-r2)"/>
<rect x="20" y="21" width="280" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="280" height="144" rx="12" fill="#fff"/>
<g class="ps-f" font-size="11">
<rect x="32" y="30" width="104" height="120" rx="9" fill="#FFE9D6"/>
<rect x="52" y="62" width="64" height="12" rx="4" fill="url(#ps-g)" opacity=".75"/>
<rect x="58" y="74" width="5" height="40" rx="2" fill="#B6400B" opacity=".6"/>
<rect x="105" y="74" width="5" height="40" rx="2" fill="#B6400B" opacity=".6"/>
<rect x="150" y="34" width="90" height="8" rx="4" fill="#DDE1E6"/>
<rect class="ps-hl" x="150" y="54" width="136" height="30" rx="7" fill="#FFE9D6" opacity=".7"/>
<rect x="150" y="54" width="136" height="94" rx="7" fill="none" stroke="#E3E6EA"/>
<path d="M150 86h136M150 118h136M210 54v94" stroke="#E3E6EA"/>
<text x="160" y="73" fill="#6B7280">Material</text>
<text x="160" y="105" fill="#6B7280">Size</text>
<text x="160" y="137" fill="#6B7280">Weight</text>
<text x="220" y="73" fill="#1F2433" font-weight="600">Oak</text>
<text x="220" y="105" fill="#1F2433" font-weight="600">40 cm</text>
<text x="220" y="137" fill="#1F2433" font-weight="600">1.2 kg</text>
</g>
</svg>
