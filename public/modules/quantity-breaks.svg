<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A product card with three quantity tiers: buy 1, buy 2 for 10% off and buy 4 for 20% off. The selection moves down to the biggest saving.</title>
<style>
.qb-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.qb-b0{animation:qb-d0 11s ease-in-out infinite alternate}.qb-b1{animation:qb-d1 9s ease-in-out infinite alternate}.qb-b2{animation:qb-d0 12s ease-in-out infinite alternate-reverse}
@keyframes qb-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes qb-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.qb-sel{animation:qb-move 5s ease-in-out infinite}
@keyframes qb-move{0%,22%{transform:translateY(80px)}32%,48%{transform:translateY(0)}58%,72%{transform:translateY(40px)}82%,100%{transform:translateY(80px)}}
}
</style>
<defs><linearGradient id="qb-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient><radialGradient id="qb-r0"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="qb-r1"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="qb-r2"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="qb-b0" cx="40" cy="30" r="130" fill="url(#qb-r0)"/>
<circle class="qb-b1" cx="300" cy="160" r="140" fill="url(#qb-r1)"/>
<circle class="qb-b2" cx="250" cy="10" r="100" fill="url(#qb-r2)"/>
<rect x="20" y="21" width="280" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="280" height="144" rx="12" fill="#fff"/>
<rect x="34" y="32" width="74" height="74" rx="9" fill="#EEE6FF"/>
<rect x="60" y="46" width="22" height="48" rx="7" fill="url(#qb-g)" opacity=".75"/>
<rect x="65" y="40" width="12" height="8" rx="2" fill="#5B21B6" opacity=".8"/>
<rect x="34" y="113" width="64" height="7" rx="3.5" fill="#DDE1E6"/>
<rect x="34" y="124" width="42" height="7" rx="3.5" fill="#EBEEF1"/>
<rect x="34" y="136" width="74" height="18" rx="9" fill="url(#qb-g)"/>
<text x="71" y="148.5" class="qb-f" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">Add to cart</text>
<g class="qb-f" font-size="11">
<rect x="122" y="32" width="164" height="32" rx="8" fill="#fff" stroke="#E3E6EA"/>
<rect x="122" y="72" width="164" height="32" rx="8" fill="#fff" stroke="#E3E6EA"/>
<rect x="122" y="112" width="164" height="32" rx="8" fill="#fff" stroke="#E3E6EA"/>
<g class="qb-sel" transform="translate(0 80)">
<rect x="122" y="32" width="164" height="32" rx="8" fill="url(#qb-g)" fill-opacity=".09" stroke="#7C3AED" stroke-width="2"/>
<circle cx="138" cy="48" r="3.5" fill="url(#qb-g)"/>
</g>
<circle cx="138" cy="48" r="6" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<circle cx="138" cy="88" r="6" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<circle cx="138" cy="128" r="6" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<text x="151" y="52" fill="#1F2433" font-weight="600">Buy 1</text>
<text x="151" y="92" fill="#1F2433" font-weight="600">Buy 2</text>
<text x="151" y="132" fill="#1F2433" font-weight="600">Buy 4</text>
<text x="274" y="52" fill="#6B7280" text-anchor="end">$24</text>
<rect x="234" y="80" width="42" height="16" rx="8" fill="#EEE6FF"/>
<text x="255" y="92" fill="#5B21B6" font-weight="600" text-anchor="middle">−10%</text>
<rect x="234" y="120" width="42" height="16" rx="8" fill="url(#qb-g)"/>
<text x="255" y="132" fill="#fff" font-weight="600" text-anchor="middle">−20%</text>
</g>
</svg>
