<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A compact quick order table: quantities are typed into each row and the order total updates to $312.</title>
<style>
.qo-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.qo-b0{animation:qo-d0 11s ease-in-out infinite alternate}.qo-b1{animation:qo-d1 9s ease-in-out infinite alternate}.qo-b2{animation:qo-d0 12s ease-in-out infinite alternate-reverse}
@keyframes qo-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes qo-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.qo-q{animation:qo-q 6s ease-in-out infinite}
.qo-d2{animation-delay:.6s}.qo-d3{animation-delay:1.2s}
@keyframes qo-q{0%,6%{opacity:1}12%,24%{opacity:0}32%,100%{opacity:1}}
.qo-t{transform-box:fill-box;transform-origin:center;animation:qo-t 6s ease-in-out infinite}
@keyframes qo-t{0%,50%,100%{transform:scale(1)}58%{transform:scale(1.12)}66%{transform:scale(1)}}
}
</style>
<defs><linearGradient id="qo-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2600C"/><stop offset="1" stop-color="#F7A21B"/></linearGradient><radialGradient id="qo-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="qo-r1"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="qo-r2"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="qo-b0" cx="160" cy="-10" r="120" fill="url(#qo-r0)"/>
<circle class="qo-b1" cx="10" cy="180" r="130" fill="url(#qo-r1)"/>
<circle class="qo-b2" cx="320" cy="150" r="130" fill="url(#qo-r2)"/>
<rect x="20" y="15" width="280" height="154" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="12" width="280" height="154" rx="12" fill="#fff"/>
<g class="qo-f" font-size="11">
<path d="M32 50h256M32 82h256M32 114h256" stroke="#EBEEF1"/>
<rect x="34" y="23" width="24" height="24" rx="6" fill="#FFE9D6"/><circle cx="46" cy="35" r="6.5" fill="url(#qo-g)" opacity=".7"/>
<rect x="34" y="55" width="24" height="24" rx="6" fill="#FFE9D6"/><rect x="40" y="61" width="12" height="12" rx="3" fill="#B6400B" opacity=".5"/>
<rect x="34" y="87" width="24" height="24" rx="6" fill="#FFE9D6"/><path d="M46 92l7 13h-14z" fill="url(#qo-g)" opacity=".6"/>
<rect x="68" y="32" width="70" height="6" rx="3" fill="#DDE1E6"/>
<rect x="68" y="64" width="56" height="6" rx="3" fill="#DDE1E6"/>
<rect x="68" y="96" width="78" height="6" rx="3" fill="#DDE1E6"/>
<rect x="176" y="24" width="38" height="22" rx="6" fill="#fff" stroke="#EA580C" stroke-width="1.5"/>
<rect x="176" y="56" width="38" height="22" rx="6" fill="#fff" stroke="#EA580C" stroke-width="1.5"/>
<rect x="176" y="88" width="38" height="22" rx="6" fill="#fff" stroke="#EA580C" stroke-width="1.5"/>
<g class="qo-q"><text x="195" y="39" fill="#1F2433" font-weight="600" text-anchor="middle">12</text><text x="286" y="39" fill="#1F2433" text-anchor="end">$108</text></g>
<g class="qo-q qo-d2"><text x="195" y="71" fill="#1F2433" font-weight="600" text-anchor="middle">6</text><text x="286" y="71" fill="#1F2433" text-anchor="end">$84</text></g>
<g class="qo-q qo-d3"><text x="195" y="103" fill="#1F2433" font-weight="600" text-anchor="middle">24</text><text x="286" y="103" fill="#1F2433" text-anchor="end">$120</text></g>
<text x="34" y="144" fill="#6B7280">Total</text>
<text class="qo-t" x="66" y="145" fill="#1F2433" font-size="16" font-weight="600">$312</text>
<rect x="184" y="126" width="102" height="28" rx="14" fill="url(#qo-g)"/>
<text x="235" y="144" fill="#fff" font-weight="600" text-anchor="middle">Add to cart</text>
</g>
</svg>
