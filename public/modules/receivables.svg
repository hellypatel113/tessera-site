<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A list of unpaid invoices with amounts due; a payment reminder is sent with a ringing bell.</title>
<style>
.rc-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.rc-b0{animation:rc-d0 11s ease-in-out infinite alternate}.rc-b1{animation:rc-d1 9s ease-in-out infinite alternate}.rc-b2{animation:rc-d0 12s ease-in-out infinite alternate-reverse}
@keyframes rc-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes rc-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.rc-bell{transform-box:fill-box;transform-origin:50% 0;animation:rc-ring 5s ease-in-out infinite}
@keyframes rc-ring{0%,50%,100%{transform:rotate(0)}58%{transform:rotate(12deg)}66%{transform:rotate(-10deg)}74%{transform:rotate(6deg)}82%{transform:rotate(0)}}
.rc-env{animation:rc-env 5s ease-in-out infinite}
@keyframes rc-env{0%,8%{opacity:1;transform:translate(0,0)}16%{opacity:0;transform:translate(0,0)}20%{opacity:0;transform:translate(-56px,-42px) scale(.7)}30%{opacity:1;transform:translate(-56px,-42px) scale(.7)}50%,100%{opacity:1;transform:translate(0,0)}}
}
</style>
<defs><linearGradient id="rc-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F43F5E"/><stop offset="1" stop-color="#FB8B3C"/></linearGradient><radialGradient id="rc-r0"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><radialGradient id="rc-r1"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="rc-r2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="rc-b0" cx="290" cy="20" r="130" fill="url(#rc-r0)"/>
<circle class="rc-b1" cx="20" cy="170" r="140" fill="url(#rc-r1)"/>
<circle class="rc-b2" cx="170" cy="190" r="90" fill="url(#rc-r2)"/>
<rect x="20" y="21" width="198" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="198" height="144" rx="12" fill="#fff"/>
<g class="rc-f" font-size="11">
<text x="34" y="40" fill="#1F2433" font-size="12" font-weight="600">Unpaid invoices</text>
<path d="M32 52h174M32 88h174M32 124h174" stroke="#EBEEF1"/>
<g><rect x="34" y="60" width="18" height="22" rx="3" fill="#FFE1E6"/><path d="M38 67h10M38 72h10M38 77h6" stroke="#B5123A" stroke-width="1.4" opacity=".7"/>
<text x="60" y="75" fill="#1F2433" font-weight="600">#204</text>
<rect x="98" y="63" width="48" height="16" rx="8" fill="url(#rc-g)"/><text x="122" y="74.5" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Overdue</text>
<text x="204" y="75" fill="#1F2433" font-weight="600" text-anchor="end">$1,240</text></g>
<g><rect x="34" y="96" width="18" height="22" rx="3" fill="#EBEEF1"/><path d="M38 103h10M38 108h10M38 113h6" stroke="#9AA3AD" stroke-width="1.4"/>
<text x="60" y="111" fill="#1F2433" font-weight="600">#211</text>
<text x="204" y="111" fill="#1F2433" text-anchor="end">$860</text></g>
<g><rect x="34" y="132" width="18" height="22" rx="3" fill="#EBEEF1"/><path d="M38 139h10M38 144h10M38 149h6" stroke="#9AA3AD" stroke-width="1.4"/>
<text x="60" y="147" fill="#1F2433" font-weight="600">#219</text>
<text x="204" y="147" fill="#1F2433" text-anchor="end">$1,360</text></g>
<circle cx="268" cy="54" r="24" fill="#1E1B4B" opacity=".09" transform="translate(0 3)"/>
<circle cx="268" cy="54" r="24" fill="#fff"/>
<g class="rc-bell"><path d="M268 40a2 2 0 0 1 2 2v1.5c5 1 8 5 8 10v6l3 4h-26l3-4v-6c0-5 3-9 8-10V42a2 2 0 0 1 2-2z" fill="url(#rc-g)"/><circle cx="268" cy="66.5" r="3" fill="url(#rc-g)"/></g>
<path d="M228 72q14 22 30 30" fill="none" stroke="#E11D48" stroke-width="1.5" stroke-dasharray="2 5" stroke-linecap="round" opacity=".6"/>
<g class="rc-env">
<rect x="250" y="102" width="44" height="30" rx="6" fill="#1E1B4B" opacity=".09" transform="translate(0 3)"/>
<rect x="250" y="102" width="44" height="30" rx="6" fill="#fff" stroke="#E11D48" stroke-width="1.6"/>
<path d="M253 106l19 13 19-13" fill="none" stroke="#E11D48" stroke-width="1.6" stroke-linejoin="round"/>
</g>
</g>
</svg>
