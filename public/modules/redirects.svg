<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A broken link to a 404 page is redirected by an arrow to a working product page.</title>
<style>
.rd-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.rd-b0{animation:rd-d0 11s ease-in-out infinite alternate}.rd-b1{animation:rd-d1 9s ease-in-out infinite alternate}.rd-b2{animation:rd-d0 12s ease-in-out infinite alternate-reverse}
@keyframes rd-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes rd-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.rd-flow{animation:rd-flow 1.6s linear infinite}
@keyframes rd-flow{to{stroke-dashoffset:-14}}
.rd-new{transform-box:fill-box;transform-origin:center;animation:rd-new 5s ease-in-out infinite}
@keyframes rd-new{0%,40%,100%{transform:scale(1)}55%{transform:scale(1.04)}70%{transform:scale(1)}}
.rd-old{animation:rd-old 5s ease-in-out infinite}
@keyframes rd-old{0%,30%,100%{opacity:1}50%,70%{opacity:.55}}
}
</style>
<defs><linearGradient id="rd-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F43F5E"/><stop offset="1" stop-color="#FB8B3C"/></linearGradient><radialGradient id="rd-r0"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="rd-r1"><stop offset="0" stop-color="#FDBA74" stop-opacity=".75"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient><radialGradient id="rd-r2"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="rd-b0" cx="160" cy="-10" r="120" fill="url(#rd-r0)"/>
<circle class="rd-b1" cx="10" cy="180" r="130" fill="url(#rd-r1)"/>
<circle class="rd-b2" cx="320" cy="150" r="130" fill="url(#rd-r2)"/>
<g class="rd-f" font-size="11">
<g class="rd-old">
<rect x="20" y="37" width="112" height="110" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="34" width="112" height="110" rx="12" fill="#fff"/>
<rect x="30" y="44" width="92" height="18" rx="9" fill="#F3F4F6"/>
<text x="38" y="56.5" fill="#6B7280" font-size="10">/old-page</text>
<text x="76" y="104" fill="#9AA3AD" font-size="30" font-weight="600" text-anchor="middle">404</text>
<rect x="44" y="116" width="64" height="6" rx="3" fill="#EBEEF1"/>
<rect x="54" y="127" width="44" height="6" rx="3" fill="#EBEEF1"/>
</g>
<path class="rd-flow" d="M128 72q32-34 64 0" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-dasharray="7 7" stroke-linecap="round"/>
<path d="M184 62l9 11-13 2" fill="none" stroke="#E11D48" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="142" y="30" width="36" height="18" rx="9" fill="url(#rd-g)"/>
<text x="160" y="42.5" fill="#fff" font-size="10.5" font-weight="600" text-anchor="middle">301</text>
<g class="rd-new">
<rect x="188" y="37" width="112" height="110" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="188" y="34" width="112" height="110" rx="12" fill="#fff" stroke="#E11D48" stroke-width="1.5"/>
<rect x="198" y="44" width="92" height="18" rx="9" fill="#FFE1E6"/>
<text x="206" y="56.5" fill="#B5123A" font-size="10" font-weight="600">/new-page</text>
<rect x="198" y="70" width="40" height="40" rx="7" fill="#FFE1E6"/><circle cx="218" cy="90" r="11" fill="url(#rd-g)" opacity=".7"/>
<rect x="246" y="74" width="40" height="6" rx="3" fill="#DDE1E6"/><rect x="246" y="86" width="28" height="6" rx="3" fill="#EBEEF1"/>
<rect x="198" y="120" width="88" height="16" rx="8" fill="url(#rd-g)"/>
<circle cx="292" cy="38" r="9" fill="url(#rd-g)" stroke="#fff" stroke-width="2"/>
<path d="M288.2 38.2l2.6 2.6 5-5.4" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</g>
</svg>
