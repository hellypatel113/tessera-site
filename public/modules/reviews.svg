<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>Product reviews: a 4.8 star rating next to review cards whose stars fill in, one with a Verified badge and a customer photo.</title>
<defs><path id="rv-s" d="M0-6L1.53-2.1L5.71-1.85L2.47.8L3.53 4.85L0 2.6L-3.53 4.85L-2.47.8L-5.71-1.85L-1.53-2.1Z"/></defs>
<style>
.rv-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.rv-b0{animation:rv-d0 11s ease-in-out infinite alternate}.rv-b1{animation:rv-d1 9s ease-in-out infinite alternate}.rv-b2{animation:rv-d0 12s ease-in-out infinite alternate-reverse}
@keyframes rv-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes rv-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.rv-on{transform-box:fill-box;transform-origin:center;animation:rv-star 5s ease-in-out infinite}
.rv-2{animation-delay:.18s}.rv-3{animation-delay:.36s}.rv-4{animation-delay:.54s}.rv-5{animation-delay:.72s}
@keyframes rv-star{0%,6%{opacity:1;transform:scale(1)}14%,24%{opacity:0;transform:scale(.5)}34%,100%{opacity:1;transform:scale(1)}}
}
</style>
<defs><linearGradient id="rv-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient><radialGradient id="rv-r0"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="rv-r1"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient><radialGradient id="rv-r2"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient></defs>
