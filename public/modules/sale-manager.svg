<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>Three products on sale: each old price is struck through and replaced by a lower one, with a Sale badge.</title>
<style>
.sm-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.sm-b0{animation:sm-d0 11s ease-in-out infinite alternate}.sm-b1{animation:sm-d1 9s ease-in-out infinite alternate}.sm-b2{animation:sm-d0 12s ease-in-out infinite alternate-reverse}
@keyframes sm-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes sm-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.sm-s{transform-box:fill-box;transform-origin:left;animation:sm-strike 5s ease-in-out infinite}
.sm-n{animation:sm-new 5s ease-in-out infinite}
.sm-b{transform-box:fill-box;transform-origin:center;animation:sm-badge 5s ease-in-out infinite}
.sm-d2{animation-delay:.4s}.sm-d3{animation-delay:.8s}
@keyframes sm-strike{0%,8%{transform:scaleX(1)}16%,26%{transform:scaleX(0)}40%,100%{transform:scaleX(1)}}
@keyframes sm-new{0%,8%{opacity:1;transform:translateY(0)}16%,40%{opacity:0;transform:translateY(5px)}52%,100%{opacity:1;transform:translateY(0)}}
@keyframes sm-badge{0%,8%{opacity:1;transform:scale(1)}16%,44%{opacity:0;transform:scale(.6)}56%,100%{opacity:1;transform:scale(1)}}
}
</style>
<defs><linearGradient id="sm-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F43F5E"/><stop offset="1" stop-color="#FB8B3C"/></linearGradient><radialGradient id="sm-r0"><stop offset="0" stop-color="#E879F9" stop-opacity=".75"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/></radialGradient><radialGradient id="sm-r1"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="sm-r2"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="sm-b0" cx="40" cy="30" r="130" fill="url(#sm-r0)"/>
<circle class="sm-b1" cx="300" cy="160" r="140" fill="url(#sm-r1)"/>
<circle class="sm-b2" cx="250" cy="10" r="100" fill="url(#sm-r2)"/>
<g class="sm-f" font-size="11">
<rect x="22" y="23" width="84" height="138" rx="11" fill="#1E1B4B" opacity=".09"/>
<rect x="22" y="20" width="84" height="138" rx="11" fill="#fff"/>
<rect x="29" y="27" width="70" height="70" rx="8" fill="#FFE1E6"/>
<circle cx="64" cy="64" r="17" fill="url(#sm-g)" opacity=".7"/>
<g class="sm-b"><rect x="34" y="32" width="34" height="16" rx="8" fill="url(#sm-g)"/><text x="51" y="43.5" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Sale</text></g>
<rect x="30" y="106" width="56" height="6" rx="3" fill="#DDE1E6"/>
<text x="30" y="131" fill="#6B7280">$40</text>
<rect class="sm-s" x="29" y="126.5" width="22" height="1.6" fill="#6B7280"/>
<text class="sm-n" x="30" y="148" fill="#B5123A" font-size="13" font-weight="600">$32</text>
<rect x="118" y="23" width="84" height="138" rx="11" fill="#1E1B4B" opacity=".09"/>
<rect x="118" y="20" width="84" height="138" rx="11" fill="#fff"/>
<rect x="125" y="27" width="70" height="70" rx="8" fill="#FFE1E6"/>
<path d="M160 44l18 34h-36z" fill="url(#sm-g)" opacity=".6"/>
<g class="sm-b sm-d2"><rect x="130" y="32" width="34" height="16" rx="8" fill="url(#sm-g)"/><text x="147" y="43.5" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Sale</text></g>
<rect x="126" y="106" width="48" height="6" rx="3" fill="#DDE1E6"/>
<text x="126" y="131" fill="#6B7280">$25</text>
<rect class="sm-s sm-d2" x="125" y="126.5" width="22" height="1.6" fill="#6B7280"/>
<text class="sm-n sm-d2" x="126" y="148" fill="#B5123A" font-size="13" font-weight="600">$19</text>
<rect x="214" y="23" width="84" height="138" rx="11" fill="#1E1B4B" opacity=".09"/>
<rect x="214" y="20" width="84" height="138" rx="11" fill="#fff"/>
<rect x="221" y="27" width="70" height="70" rx="8" fill="#FFE1E6"/>
<rect x="241" y="45" width="30" height="34" rx="7" fill="#B5123A" opacity=".55"/>
<g class="sm-b sm-d3"><rect x="226" y="32" width="34" height="16" rx="8" fill="url(#sm-g)"/><text x="243" y="43.5" fill="#fff" font-size="10" font-weight="600" text-anchor="middle">Sale</text></g>
<rect x="222" y="106" width="60" height="6" rx="3" fill="#DDE1E6"/>
<text x="222" y="131" fill="#6B7280">$60</text>
<rect class="sm-s sm-d3" x="221" y="126.5" width="22" height="1.6" fill="#6B7280"/>
<text class="sm-n sm-d3" x="222" y="148" fill="#B5123A" font-size="13" font-weight="600">$45</text>
</g>
</svg>
