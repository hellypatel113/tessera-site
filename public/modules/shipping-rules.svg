<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>Delivery options Standard, Express and Pickup; a rule hides the Express option at checkout.</title>
<style>
.sr-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.sr-b0{animation:sr-d0 11s ease-in-out infinite alternate}.sr-b1{animation:sr-d1 9s ease-in-out infinite alternate}.sr-b2{animation:sr-d0 12s ease-in-out infinite alternate-reverse}
@keyframes sr-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes sr-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.sr-ex{animation:sr-ex 6s ease-in-out infinite}
.sr-eye{animation:sr-eye 6s ease-in-out infinite}
.sr-rule{transform-box:fill-box;transform-origin:center;animation:sr-rule 6s ease-in-out infinite}
@keyframes sr-ex{0%,8%{opacity:.35}18%,52%{opacity:1}62%,100%{opacity:.35}}
@keyframes sr-eye{0%,8%{opacity:1}18%,52%{opacity:0}62%,100%{opacity:1}}
@keyframes sr-rule{0%,52%,100%{transform:scale(1)}58%{transform:scale(1.08)}66%{transform:scale(1)}}
}
</style>
<defs><linearGradient id="sr-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2600C"/><stop offset="1" stop-color="#F7A21B"/></linearGradient><radialGradient id="sr-r0"><stop offset="0" stop-color="#E879F9" stop-opacity=".75"/><stop offset="1" stop-color="#E879F9" stop-opacity="0"/></radialGradient><radialGradient id="sr-r1"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient><radialGradient id="sr-r2"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="sr-b0" cx="40" cy="30" r="130" fill="url(#sr-r0)"/>
<circle class="sr-b1" cx="300" cy="160" r="140" fill="url(#sr-r1)"/>
<circle class="sr-b2" cx="250" cy="10" r="100" fill="url(#sr-r2)"/>
<rect x="18" y="15" width="200" height="154" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="18" y="12" width="200" height="154" rx="12" fill="#fff"/>
<g class="sr-f" font-size="11">
<text x="32" y="36" fill="#1F2433" font-size="12" font-weight="600">Delivery</text>
<rect x="32" y="48" width="172" height="32" rx="8" fill="#fff" stroke="#EA580C" stroke-width="1.6"/>
<circle cx="46" cy="64" r="5.5" fill="none" stroke="#EA580C" stroke-width="1.4"/><circle cx="46" cy="64" r="2.8" fill="url(#sr-g)"/>
<text x="58" y="68" fill="#1F2433" font-weight="600">Standard</text><text x="194" y="68" fill="#1F2433" text-anchor="end">$5</text>
<g class="sr-ex" opacity=".35">
<rect x="32" y="86" width="172" height="32" rx="8" fill="#fff" stroke="#E3E6EA"/>
<circle cx="46" cy="102" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<text x="58" y="106" fill="#1F2433" font-weight="600">Express</text><text x="194" y="106" fill="#1F2433" text-anchor="end">$15</text>
<path d="M58 102.5h44" stroke="#6B7280" stroke-width="1.4" class="sr-eye"/>
</g>
<rect x="32" y="124" width="172" height="32" rx="8" fill="#fff" stroke="#E3E6EA"/>
<circle cx="46" cy="140" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.4"/>
<text x="58" y="144" fill="#1F2433" font-weight="600">Pickup</text><text x="194" y="144" fill="#1F2433" text-anchor="end">Free</text>
<path d="M226 102h-14" stroke="#EA580C" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round"/>
<g class="sr-rule">
<rect x="232" y="69" width="72" height="70" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="232" y="66" width="72" height="70" rx="12" fill="#fff"/>
<path d="M248 80h22l-8.5 10v8l-5 3V90z" fill="url(#sr-g)"/>
<text x="276" y="94" fill="#B6400B" font-weight="600">Rule</text>
<rect x="244" y="110" width="48" height="16" rx="8" fill="#FFE9D6"/>
<path d="M254 114l8 8M262 114l-8 8" stroke="#B6400B" stroke-width="1.6" stroke-linecap="round" opacity="0"/>
<text x="268" y="121.5" fill="#B6400B" font-size="10" font-weight="600" text-anchor="middle">Hide</text>
</g>
</g>
</svg>
