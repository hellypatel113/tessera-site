<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A post-purchase thank-you page asking "How did you find us?"; a shopper clicks the answer "A friend".</title>
<style>
.sv-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.sv-b0{animation:sv-d0 11s ease-in-out infinite alternate}.sv-b1{animation:sv-d1 9s ease-in-out infinite alternate}.sv-b2{animation:sv-d0 12s ease-in-out infinite alternate-reverse}
@keyframes sv-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes sv-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.sv-cur{animation:sv-cur 5s ease-in-out infinite}
.sv-sel{animation:sv-sel 5s ease-in-out infinite}
@keyframes sv-cur{0%,10%{transform:translate(0,0)}20%{transform:translate(52px,40px)}50%{transform:translate(0,0)}56%{transform:translate(0,2px) scale(.92)}62%,100%{transform:translate(0,0)}}
@keyframes sv-sel{0%,12%{opacity:1}20%,52%{opacity:0}58%,100%{opacity:1}}
}
</style>
<defs><linearGradient id="sv-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#EC4899"/></linearGradient><radialGradient id="sv-r0"><stop offset="0" stop-color="#FCD34D" stop-opacity=".75"/><stop offset="1" stop-color="#FCD34D" stop-opacity="0"/></radialGradient><radialGradient id="sv-r1"><stop offset="0" stop-color="#FB7185" stop-opacity=".75"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></radialGradient><radialGradient id="sv-r2"><stop offset="0" stop-color="#5EEAD4" stop-opacity=".75"/><stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="sv-b0" cx="290" cy="20" r="130" fill="url(#sv-r0)"/>
<circle class="sv-b1" cx="20" cy="170" r="140" fill="url(#sv-r1)"/>
<circle class="sv-b2" cx="170" cy="190" r="90" fill="url(#sv-r2)"/>
<rect x="40" y="15" width="240" height="152" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="40" y="12" width="240" height="152" rx="12" fill="#fff"/>
<g class="sv-f" font-size="11">
<circle cx="64" cy="34" r="10" fill="url(#sv-g)"/>
<path d="M59.5 34.5l3 3 6-6.4" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="82" y="38" fill="#6B7280">Thanks for your order</text>
<text x="56" y="66" fill="#1F2433" font-size="12" font-weight="600">How did you find us?</text>
<rect x="56" y="76" width="208" height="24" rx="7" fill="#fff" stroke="#E3E6EA"/>
<rect x="56" y="104" width="208" height="24" rx="7" fill="#fff" stroke="#E3E6EA"/>
<rect x="56" y="132" width="208" height="24" rx="7" fill="#fff" stroke="#E3E6EA"/>
<g class="sv-sel"><rect x="56" y="104" width="208" height="24" rx="7" fill="url(#sv-g)" fill-opacity=".08" stroke="#7C3AED" stroke-width="1.8"/><circle cx="70" cy="116" r="3" fill="url(#sv-g)"/></g>
<circle cx="70" cy="88" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.3"/>
<circle cx="70" cy="116" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.3"/>
<circle cx="70" cy="144" r="5.5" fill="none" stroke="#9AA3AD" stroke-width="1.3"/>
<text x="82" y="92" fill="#1F2433">Instagram</text>
<text x="82" y="120" fill="#1F2433" font-weight="600">A friend</text>
<text x="82" y="148" fill="#1F2433">Search</text>
<g class="sv-cur"><path d="M168 114l0 17 4.5-4.2 3.2 7 3-1.4-3.2-6.8 6.2-.3z" fill="#1F2433" stroke="#fff" stroke-width="1.2" stroke-linejoin="round"/></g>
</g>
</svg>
