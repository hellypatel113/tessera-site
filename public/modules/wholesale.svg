<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180" role="img">
<title>A product page seen by a customer tagged Trade: the regular  price is struck through and a  trade price is shown.</title>
<style>
.ws-f{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion: no-preference){
.ws-b0{animation:ws-d0 11s ease-in-out infinite alternate}.ws-b1{animation:ws-d1 9s ease-in-out infinite alternate}.ws-b2{animation:ws-d0 12s ease-in-out infinite alternate-reverse}
@keyframes ws-d0{from{transform:translate(0,0)}to{transform:translate(18px,12px)}}@keyframes ws-d1{from{transform:translate(0,0)}to{transform:translate(-20px,-10px)}}
.ws-tag{animation:ws-tag 5s ease-in-out infinite}
.ws-s{transform-box:fill-box;transform-origin:left;animation:ws-s 5s ease-in-out infinite}
.ws-n{animation:ws-n 5s ease-in-out infinite}
@keyframes ws-tag{0%,8%{opacity:1;transform:translateX(0)}16%,26%{opacity:0;transform:translateX(16px)}38%,100%{opacity:1;transform:translateX(0)}}
@keyframes ws-s{0%,8%{transform:scaleX(1)}16%,40%{transform:scaleX(0)}50%,100%{transform:scaleX(1)}}
@keyframes ws-n{0%,8%{opacity:1;transform:translateY(0)}16%,46%{opacity:0;transform:translateY(6px)}58%,100%{opacity:1;transform:translateY(0)}}
}
</style>
<defs><linearGradient id="ws-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#6366F1"/></linearGradient><radialGradient id="ws-r0"><stop offset="0" stop-color="#FDBA74" stop-opacity=".75"/><stop offset="1" stop-color="#FDBA74" stop-opacity="0"/></radialGradient><radialGradient id="ws-r1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".75"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><radialGradient id="ws-r2"><stop offset="0" stop-color="#60A5FA" stop-opacity=".75"/><stop offset="1" stop-color="#60A5FA" stop-opacity="0"/></radialGradient></defs>
<rect width="320" height="180" fill="#F4F1FA"/>
<circle class="ws-b0" cx="20" cy="100" r="120" fill="url(#ws-r0)"/>
<circle class="ws-b1" cx="280" cy="40" r="130" fill="url(#ws-r1)"/>
<circle class="ws-b2" cx="200" cy="190" r="110" fill="url(#ws-r2)"/>
<rect x="20" y="21" width="280" height="144" rx="12" fill="#1E1B4B" opacity=".09"/>
<rect x="20" y="18" width="280" height="144" rx="12" fill="#fff"/>
<g class="ws-f" font-size="11">
<rect x="32" y="30" width="104" height="120" rx="9" fill="#E0ECFF"/>
<rect x="54" y="58" width="60" height="66" rx="8" fill="url(#ws-g)" opacity=".7"/>
<rect x="66" y="50" width="36" height="12" rx="4" fill="#3443C4" opacity=".5"/>
<g class="ws-tag">
<rect x="196" y="30" width="90" height="24" rx="12" fill="url(#ws-g)"/>
<circle cx="211" cy="39.5" r="3.6" fill="#fff"/><path d="M204.5 48c1-4.5 12-4.5 13 0z" fill="#fff"/>
<text x="224" y="46" fill="#fff" font-size="12" font-weight="600">Trade</text>
</g>
<rect x="150" y="68" width="100" height="8" rx="4" fill="#DDE1E6"/>
<rect x="150" y="82" width="66" height="8" rx="4" fill="#EBEEF1"/>
<text x="150" y="114" fill="#6B7280" font-size="13">$48</text>
<rect class="ws-s" x="149" y="109" width="27" height="1.6" fill="#6B7280"/>
<g class="ws-n">
<text x="150" y="141" fill="#3443C4" font-size="22" font-weight="600">$32</text>
<text x="196" y="140" fill="#6B7280">Trade price</text>
</g>
</g>
</svg>
